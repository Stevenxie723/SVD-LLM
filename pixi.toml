[workspace]
authors = ["Steven Xie <stevenxie42@gmail.com>"]
channels = ["pytorch", "nvidia", "conda-forge"]
name = "Continuous-Rank"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
python = ">=3.11.6,<3.12"
numpy = ">=1.26.4,<2"
pytorch-cuda = "11.8.*"
datasets = ">=2.14.7,<3"
evaluate = ">=0.4.6,<0.5"
peft = ">=0.13.2,<0.14"
scipy = ">=1.17.0,<2"
tensorboard = ">=2.20.0,<3"
tqdm = ">=4.67.3,<5"
pillow = ">=10.3.0,<11"
libcxx = ">=21.1.8,<22"
scikit-learn = ">=1.8.0,<2"
yacs = ">=0.1.8,<0.2"
fvcore = ">=0.1.5.post20221221,<0.2"
iopath = ">=0.1.10,<0.2"
pycocotools = ">=2.0.10,<3"
sacrebleu = ">=2.6.0,<3"
accelerate = ">=1.12.0,<2"
huggingface_hub = ">=0.23.0"
transformers = "4.49.0.*"
libjpeg-turbo = ">=3.1.2,<4"
timm = ">=1.0.24,<2"
pytorch = "2.5.1.*"
torchvision = "0.20.1.*"
torchaudio = "2.5.1.*"
tiktoken = ">=0.12.0,<0.13"
sentencepiece = ">=0.2.0,<0.3"
cvxpy = ">=1.7.5,<2"

[pypi-dependencies]
fairscale = ">=0.4.13, <0.5"
bitsandbytes = ">=0.49.1, <0.50"
lm-eval = { version = ">=0.4.10, <0.5", extras = ["hf"] }
